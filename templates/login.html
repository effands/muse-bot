<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimuse Bot — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
        .bg-mesh {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 15% 15%, rgba(0, 229, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 229, 255, 0.1);
        }
        .glow-btn {
            background: linear-gradient(135deg, #00e5ff 0%, #00b4d8 100%);
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 6px 25px rgba(0, 229, 255, 0.55);
            transform: translateY(-1px);
        }
        .input-glow:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.2);
        }

        /* LIGHT THEME */
        [data-theme="light"] body { background: #f1f5f9; color: #0f172a; }
        [data-theme="light"] .glass-card { background: rgba(255, 255, 255, 0.95); border-color: #cbd5e1; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        [data-theme="light"] .text-white { color: #0f172a !important; }
        [data-theme="light"] .text-slate-400 { color: #64748b !important; }
        [data-theme="light"] .text-slate-300 { color: #334155 !important; }
        [data-theme="light"] .bg-slate-900\/90 { background-color: #f8fafc !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        [data-theme="light"] .border-slate-800 { border-color: #e2e8f0 !important; }
    </style>
</head>
<body class="p-4">
    <div class="bg-mesh"></div>

    <div class="glass-card rounded-2xl p-8 sm:p-10 w-full max-w-md relative z-10 border border-slate-800">
        <!-- Top Status Pill -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/60 text-xs text-slate-300">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span class="mono">AUTHENTICATION GATE</span>
            </div>
            <span class="text-xs text-cyan-400 font-bold mono">ZIMUSE BOT</span>
        </div>

        <!-- Logo / Icon -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500/20 via-blue-500/10 to-indigo-500/20 border border-cyan-500/30 text-cyan-400 text-2xl mb-4 shadow-lg shadow-cyan-500/10">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Buka Kunci Sistem</h1>
            <p class="text-slate-400 text-sm mt-2">Masukkan PIN rahasia Anda untuk mengakses panel Zimuse Bot.</p>
        </div>

        <!-- Form -->
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">PIN Rahasia</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                        <i class="fa-solid fa-key text-sm"></i>
                    </span>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="••••••" 
                        required 
                        autofocus
                        class="input-glow w-full pl-10 pr-10 py-3.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white placeholder-slate-600 text-center mono text-xl tracking-widest focus:outline-none transition-all"
                    >
                    <button type="button" onclick="togglePin('password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            {% if error %}
            <div class="flex items-center gap-2 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <button type="submit" class="glow-btn w-full py-3.5 px-4 rounded-xl text-slate-950 font-bold text-sm tracking-wide uppercase flex items-center justify-center gap-2 cursor-pointer mt-4">
                <i class="fa-solid fa-unlock-keyhole"></i>
                <span>Masuk ke Dashboard</span>
            </button>
        </form>

        <!-- Footer Info -->
        <div class="mt-8 pt-6 border-t border-slate-800 text-center">
            <p class="text-xs text-slate-500 flex items-center justify-center gap-2">
                <i class="fa-solid fa-server text-cyan-400"></i>
                <span>Zimuse Bot Cloud Engine • Port 8000</span>
            </p>
        </div>
    </div>

    <script>
        function togglePin(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        (function() {
            const saved = localStorage.getItem('ziqva_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</body>
</html>
